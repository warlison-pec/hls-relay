# Copie para compose.yaml e ajuste os IPs/portas do seu host.
services:
  hls-relay:
    build: .
    container_name: boxserver-hls-relay
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8099:8099"
      # - "SEU_IP_LAN_OU_TAILSCALE:8099:8099"
    volumes:
      - ./data:/data
    environment:
      RELAY_STATE_DIR: /data
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
